<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -110 1206 760" role="img" aria-label="dc — logótipo animado"><style>
.st{animation:stem 7s cubic-bezier(.65,0,.35,1) infinite both;transform-origin:370px 0}
@keyframes stem{0%,4%{transform:scaleY(0)}18%,88%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
.d,.c{stroke-dasharray:101 200;animation:draw 7s cubic-bezier(.65,0,.35,1) infinite both}
.c{animation-name:drawc}
@keyframes draw{0%,14%{stroke-dashoffset:101}34%,86%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:-101}}
@keyframes drawc{0%,22%{stroke-dashoffset:101}42%,86%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:-101}}
.gd{animation:gd 7s ease infinite both}@keyframes gd{0%,2%{opacity:0}10%,30%{opacity:1}44%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.st,.d,.c,.gd{animation:none}}</style>
<rect x="-200" y="-110" width="1206" height="760" fill="#2a29ff"/><defs><mask id="cma" maskUnits="userSpaceOnUse" x="-200" y="-120" width="1206" height="780"><rect x="-200" y="-120" width="1206" height="780" fill="#fff"/><rect x="602" y="311" width="300" height="67" fill="#000"/></mask></defs>
<g class="gd" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="8 8"><circle cx="198" cy="345" r="195"/><circle cx="602" cy="345" r="195"/><line x1="-200" y1="345" x2="1006" y2="345"/></g><g fill="none" stroke="#fff" stroke-width="108"><circle class="d" cx="198" cy="345" r="141" pathLength="100" transform="rotate(-90 198 345)"/>
<g mask="url(#cma)"><circle class="c" cx="602" cy="345" r="141" pathLength="100" transform="rotate(10 602 345)"/></g></g>
<rect class="st" x="315" y="0" width="110" height="525" fill="#fff"/></svg>